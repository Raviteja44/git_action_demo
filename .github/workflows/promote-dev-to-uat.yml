name: "2. Promote to UAT"

on:
  workflow_dispatch:
    inputs:
      dev_pr_number:
        description: 'DEV PR number that was merged (find in Pull Requests tab)'
        required: true
        type: string
      deployment_reason:
        description: 'Reason for UAT promotion'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-uat-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR info and commits
        id: get-pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ github.event.inputs.dev_pr_number }}';
            
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              // Get ALL commits from the PR
              const { data: commits } = await github.rest.pulls.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              const commitShas = commits.map(commit => commit.sha);
              const featureBranch = pr.head.ref;
              const latestCommit = commitShas[commitShas.length - 1];
              
              console.log(`📋 All commits in PR: ${commitShas.join(', ')}`);
              console.log(`🔍 Feature branch: ${featureBranch}`);
              console.log(`⭐ Latest commit: ${latestCommit}`);
              
              // Set outputs
              core.setOutput('all_commits', commitShas.join(','));
              core.setOutput('feature_branch', featureBranch);
              core.setOutput('latest_commit', latestCommit);
              core.setOutput('pr_title', pr.title);
              core.setOutput('pr_body', pr.body);
              
            } catch (error) {
              console.error('❌ Error getting PR info:', error);
              throw error;
            }

      - name: Create UAT branch and cherry-pick
        id: create-uat-branch
        run: |
          FEATURE_BRANCH="${{ steps.get-pr-info.outputs.feature_branch }}"
          ALL_COMMITS="${{ steps.get-pr-info.outputs.all_commits }}"
          
          # Create UAT branch name that matches cleanup pattern
          UAT_BRANCH="uat-${FEATURE_BRANCH//\//-}-$(date +%s)"
          echo "UAT_BRANCH=$UAT_BRANCH" >> $GITHUB_ENV
          echo "branch_name=$UAT_BRANCH" >> $GITHUB_OUTPUT
          
          echo "🎯 Creating UAT branch: $UAT_BRANCH"
          
          # Fetch all branches
          git fetch origin
          
          # Create branch from current uat
          git checkout -b $UAT_BRANCH origin/uat
          
          # Cherry-pick each commit from the PR
          IFS=',' read -ra COMMIT_ARRAY <<< "$ALL_COMMITS"
          for commit in "${COMMIT_ARRAY[@]}"; do
            echo "🔨 Cherry-picking commit: $commit"
            if git cherry-pick $commit; then
              echo "✅ Successfully cherry-picked $commit"
            else
              echo "❌ Failed to cherry-pick $commit"
              git cherry-pick --abort
              exit 1
            fi
          done
          
          # Push the new branch
          git push origin $UAT_BRANCH
          echo "✅ Pushed UAT branch: $UAT_BRANCH"

      - name: Create UAT PR
        uses: actions/github-script@v7
        with:
          script: |
            const featureBranch = '${{ steps.get-pr-info.outputs.feature_branch }}';
            const prTitle = '${{ steps.get-pr-info.outputs.pr_title }}';
            const deploymentReason = '${{ github.event.inputs.deployment_reason }}';
            const allCommits = '${{ steps.get-pr-info.outputs.all_commits }}'.split(',');
            const uatBranch = '${{ env.UAT_BRANCH }}';
            const latestCommit = '${{ steps.get-pr-info.outputs.latest_commit }}';
            
            const prBody = `
            ## 🟡 Promotion to UAT Environment
            **Source PR:** ${prTitle}
            **Feature Branch:** ${featureBranch}
            **Latest Commit:** ${latestCommit}
            **Promotion Reason:** ${deploymentReason}
            
            **Included Commits (cherry-picked):**
            ${allCommits.map(commit => `- ${commit}`).join('\n')}
            
            **COMMIT_SHA:** ${latestCommit}
            **FEATURE_BRANCH:** ${featureBranch}
            
            **Verification:**
            ✅ Deployed to DEV
            ✅ Tested in DEV Environment
            ✅ Only PR-specific changes included
            
            **Approval Required:** Manager/Team Lead approval required.
            
            **⚠️ Temporary Branch:** ${uatBranch} (auto-deletes after merge)
            `;
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🟡 UAT: Promote ${featureBranch}`,
              body: prBody,
              head: uatBranch,
              base: 'uat'
            });
            
            console.log(`✅ Created UAT promotion PR: ${pr.html_url}`);
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['uat-promotion']
            });